name: Windows release
on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  installer:
    runs-on: windows-2025
    env:
      FASTFILEOCR_GITHUB_REPOSITORY: ${{ github.repository }}
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Set application version from tag
        id: version
        run: |
          node scripts/release/set-version.mjs $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "version=$((Get-Content package.json -Raw | ConvertFrom-Json).version)" >> $env:GITHUB_OUTPUT
      - name: Install frontend dependencies
        run: npm ci
      - name: Cache bundled CPU and document libraries
        uses: actions/cache@v4
        with:
          path: .cache/bundle
          key: windows-cpu-assets-${{ hashFiles('scripts/build/resources.ps1', 'src-tauri/src/runtimes/manifest.json') }}
      - name: Prepare CPU engine and document libraries
        run: npm run resources:prepare
      - name: Verify source and tests
        run: |
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:resources
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build NSIS installer EXE
        run: npm run installer
      - name: Verify installed resources and data lifecycle
        run: npm run installer:test
      - name: Upload installer build
        uses: actions/upload-artifact@v4
        with:
          name: FastFileOCR-${{ github.ref_name }}-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/FastFileOCR_${{ steps.version.outputs.version }}_x64-setup.exe
            src-tauri/target/release/bundle/nsis/FastFileOCR_${{ steps.version.outputs.version }}_x64-setup.exe.sha256
            src-tauri/target/release/bundle/nsis/build-info.json
          if-no-files-found: error
          compression-level: 0
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $output = "src-tauri/target/release/bundle/nsis"
          $build = Get-Content "$output/build-info.json" -Raw | ConvertFrom-Json
          $assets = @("$output/$($build.installer.file)", "$output/$($build.installer.file).sha256", "$output/build-info.json")
          foreach ($asset in $assets) { if (!(Test-Path -LiteralPath $asset)) { throw "Missing release asset: $asset" } }
          gh release view $tag --json id 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --verify-tag --title "FastFileOCR $tag" --generate-notes @assets
          } else {
            gh release upload $tag --clobber @assets
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
