[package]
name = "glyph-ocr"
version = "2.0.0"
description = "Offline document OCR with PaddleOCR-VL-1.6"
edition = "2021"
default-run = "glyph-ocr"
[lib]
name = "glyph_core"
crate-type = ["rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff"] }
pdfium-render = "=0.9.3"
pulldown-cmark = "0.13"
ammonia = "4"
tempfile = "3"
arboard = "3"
scraper = "0.24"
sha2 = "0.10"
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "load-dynamic", "api-24"] }
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
[profile.release]
strip = true
lto = "thin"
codegen-units = 1
